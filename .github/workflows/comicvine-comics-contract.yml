name: Contrato real de filmes ComicVine
on:
  push:
    branches: ["codex/bloco-9-filmes"]
    paths: ["tools/comicvine_comics_contract.py", ".github/workflows/comicvine-comics-contract.yml"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Conferir relações reais de filmes
        env:
          COMICVINE_API_KEY: ${{ secrets.COMICVINE_API_KEY }}
        run: python3 tools/comicvine_comics_contract.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: comicvine-movies-contract
          path: comicvine-movies-contract.json
          if-no-files-found: error
          retention-days: 7
