name: Sondar relações Marvel com respostas reais
on:
  push:
    branches: ["diagnostic/comicvine-real-contract"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Consultar API sem expor chave
        env:
          COMICVINE_API_KEY: ${{ secrets.COMICVINE_API_KEY }}
        run: python3 tools/comicvine_contract.py
      - uses: actions/upload-artifact@v7
        with:
          name: comicvine-real-contract
          path: comicvine-contract.json
          if-no-files-found: error
          retention-days: 7
