name: Verificar equipes Marvel reais
on:
  push:
    branches: ["diagnostic/comicvine-real-contract"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - env:
          COMICVINE_API_KEY: ${{ secrets.COMICVINE_API_KEY }}
        run: python3 tools/comicvine_filters.py
      - uses: actions/upload-artifact@v7
        with:
          name: comicvine-filters
          path: comicvine-filters.json
          retention-days: 7
          if-no-files-found: error
