name: Android build e lint

on:
  push:
    branches: [main, "codex/**"]
    paths-ignore: ["tools/comicvine_history_contract.py", ".github/workflows/comicvine-history-contract.yml", "tools/comicvine_comics_contract.py", ".github/workflows/comicvine-comics-contract.yml"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    if: github.head_ref != 'codex/bloco-16-creation-preparation' && github.ref_name != 'codex/bloco-16-creation-preparation' && github.head_ref != 'codex/bloco-14-generation-proposal' && github.ref_name != 'codex/bloco-14-generation-proposal' && github.head_ref != 'codex/bloco-15-local-drafts' && github.ref_name != 'codex/bloco-15-local-drafts'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Identificar escopo da verificação
        id: scope
        env:
          CHECK_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git fetch --no-tags origin "$CHECK_HEAD" --depth=2
          git diff --name-only "$CHECK_HEAD^" "$CHECK_HEAD" > /tmp/marv-changed-paths.txt
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          paths = set(Path('/tmp/marv-changed-paths.txt').read_text().splitlines())
          allowed = {'.github/scripts/check-issue.py', '.github/workflows/android-build.yml',
                     'app/src/debug/java/com/example/app_marvel/diagnostics/IssueCheckActivity.java',
                     'README.md', 'docs/bloco-6-detalhes-quadrinho.md',
                     'app/src/main/res/values/arc_details.xml', 'app/src/main/res/values/arcs.xml'}
          focused = '.github/scripts/check-issue.py' in paths and paths <= allowed
          arc_allowed = {'.github/scripts/check-arcs.py', '.github/workflows/android-build.yml',
                         'app/src/debug/java/com/example/app_marvel/diagnostics/ArcsCheckActivity.java',
                         'README.md', 'docs/bloco-7-arcos.md'}
          arc_only = '.github/scripts/check-arcs.py' in paths and paths <= arc_allowed
          detail_allowed = {'.github/scripts/check-arc-detail.py', '.github/workflows/android-build.yml',
                            'app/src/debug/java/com/example/app_marvel/diagnostics/ArcDetailsCheckActivity.java',
                            'README.md', 'docs/bloco-8-detalhes-arco.md'}
          arc_detail_only = '.github/scripts/check-arc-detail.py' in paths and paths <= detail_allowed
          movie_allowed = {'.github/scripts/check-movies.py', '.github/workflows/android-build.yml',
                           'app/src/debug/java/com/example/app_marvel/diagnostics/MoviesCheckActivity.java',
                           'README.md', 'docs/bloco-9-filmes.md'}
          movie_only = '.github/scripts/check-movies.py' in paths and paths <= movie_allowed
          movie_detail_allowed = {'.github/scripts/check-movie-detail.py', '.github/workflows/android-build.yml',
              'app/src/debug/AndroidManifest.xml', 'app/src/debug/java/com/example/app_marvel/diagnostics/MovieDetailsCheckActivity.java',
              'app/src/main/java/com/example/app_marvel/MainActivity.java',
              'app/src/main/java/com/example/app_marvel/data/catalog/CatalogModels.java',
              'app/src/main/java/com/example/app_marvel/data/catalog/MarvelRepository.java',
              'app/src/main/java/com/example/app_marvel/data/catalog/CatalogDescriptions.java',
              'app/src/main/java/com/example/app_marvel/ui/movies/MovieDetailsViewModel.java',
              'app/src/main/java/com/example/app_marvel/ui/movies/MovieDetailsFragment.java',
              'app/src/main/java/com/example/app_marvel/ui/movies/MoviesFragment.java',
              'app/src/main/java/com/example/app_marvel/ui/components/MovieFeaturedAdapter.java',
              'app/src/main/res/layout/fragment_movie_details.xml', 'app/src/main/res/values/movie_details.xml',
              'app/src/main/res/navigation/main_graph.xml', 'src/theme/movie-details.json',
              'README.md', 'docs/bloco-10-detalhes-filme.md'}
          movie_detail_only = '.github/scripts/check-movie-detail.py' in paths and paths <= movie_detail_allowed
          movie_detail_test_allowed = {'.github/scripts/check-movie-detail.py', '.github/workflows/android-build.yml',
              'app/src/debug/java/com/example/app_marvel/diagnostics/MovieDetailsCheckActivity.java',
              'README.md', 'docs/bloco-10-detalhes-filme.md'}
          movie_detail_test_only = '.github/scripts/check-movie-detail.py' in paths and paths <= movie_detail_test_allowed
          series_allowed = {'.github/scripts/check-series.py', 'app/src/main/java/com/example/app_marvel/ui/series/SeriesFragment.java', 'app/src/main/java/com/example/app_marvel/ui/series/SeriesViewModel.java', 'app/src/main/res/navigation/main_graph.xml', 'app/src/main/java/com/example/app_marvel/MainActivity.java', 'app/src/main/res/layout/fragment_series.xml', 'docs/bloco-11-series.md', 'app/src/main/res/layout/fragment_stories.xml', 'src/theme/series.json', 'app/src/main/java/com/example/app_marvel/data/catalog/MarvelRepository.java', 'app/src/debug/AndroidManifest.xml', 'app/src/main/java/com/example/app_marvel/ui/history/StoriesFragment.java', 'app/src/main/java/com/example/app_marvel/ui/components/SeriesFeaturedAdapter.java', 'app/src/main/res/values/series.xml', 'README.md', '.github/workflows/android-build.yml', 'app/src/main/res/layout/item_featured_movie.xml', 'app/src/main/java/com/example/app_marvel/data/catalog/CatalogModels.java', 'app/src/debug/java/com/example/app_marvel/diagnostics/SeriesCheckActivity.java', 'app/src/main/java/com/example/app_marvel/ui/components/SeriesCoverAdapter.java'}
          series_only = bool(paths & {'.github/scripts/check-series.py', 'app/src/main/java/com/example/app_marvel/ui/series/SeriesFragment.java', 'app/src/main/java/com/example/app_marvel/ui/series/SeriesViewModel.java', 'app/src/main/res/layout/fragment_series.xml', 'app/src/main/res/values/series.xml'}) and paths <= series_allowed
          series_test_allowed = {'.github/scripts/check-series.py', '.github/workflows/android-build.yml', 'app/src/debug/java/com/example/app_marvel/diagnostics/SeriesCheckActivity.java', 'README.md', 'docs/bloco-11-series.md'}
          series_test_only = '.github/scripts/check-series.py' in paths and paths <= series_test_allowed
          series_detail_allowed = {'app/src/main/res/values/series_details.xml', 'app/src/main/res/navigation/main_graph.xml', '.github/scripts/check-series-detail.py', 'app/src/debug/java/com/example/app_marvel/diagnostics/SeriesDetailsCheckActivity.java', 'app/src/main/java/com/example/app_marvel/ui/series/SeriesDetailsFragment.java', 'README.md', 'app/src/main/java/com/example/app_marvel/ui/series/SeriesDetailsViewModel.java', 'app/src/main/java/com/example/app_marvel/ui/series/SeriesFragment.java', '.github/workflows/android-build.yml', 'app/src/debug/AndroidManifest.xml', 'app/src/main/java/com/example/app_marvel/data/catalog/CatalogModels.java', 'src/theme/series-details.json', 'app/src/main/java/com/example/app_marvel/MainActivity.java', 'app/src/main/java/com/example/app_marvel/data/catalog/MarvelRepository.java', 'app/src/main/java/com/example/app_marvel/ui/components/SeriesFeaturedAdapter.java', '.github/scripts/check-series.py', 'app/src/main/res/layout/fragment_series_details.xml', 'docs/bloco-12-detalhes-serie.md', 'app/src/main/java/com/example/app_marvel/data/catalog/CatalogDescriptions.java'}
          series_detail_allowed.add('app/src/main/res/values/series.xml')
          series_detail_only = bool(paths & {'.github/scripts/check-series-detail.py', 'app/src/main/java/com/example/app_marvel/ui/series/SeriesDetailsFragment.java', 'app/src/main/java/com/example/app_marvel/ui/series/SeriesDetailsViewModel.java'}) and paths <= series_detail_allowed
          series_detail_followup_allowed = {'.github/scripts/check-series-detail.py', '.github/workflows/android-build.yml', 'app/src/main/java/com/example/app_marvel/ui/series/SeriesDetailsFragment.java', 'app/src/main/java/com/example/app_marvel/ui/series/SeriesDetailsViewModel.java', 'app/src/main/res/values/series_details.xml', 'app/src/main/res/values/series.xml', 'app/src/debug/java/com/example/app_marvel/diagnostics/SeriesDetailsCheckActivity.java', 'docs/bloco-12-detalhes-serie.md', 'README.md', 'src/theme/series-details.json'}
          series_detail_followup_only = series_detail_only and paths <= series_detail_followup_allowed
          hero_form_allowed = {'app/src/main/java/com/example/app_marvel/ui/createhero/CreateHeroViewModel.java', 'app/src/main/res/layout/fragment_create_hero.xml', 'app/src/debug/AndroidManifest.xml', 'app/src/main/res/values/create_hero.xml', 'docs/bloco-13-criar-heroi.md', 'README.md', 'src/theme/create-hero.json', 'app/src/main/java/com/example/app_marvel/data/catalog/MarvelRepository.java', 'app/src/main/java/com/example/app_marvel/data/catalog/CatalogModels.java', 'app/src/debug/java/com/example/app_marvel/diagnostics/HeroFormCheckActivity.java', '.github/scripts/check-hero-form.py', 'app/src/main/java/com/example/app_marvel/ui/createhero/CreateHeroFragment.java', '.github/workflows/android-build.yml', 'app/src/main/java/com/example/app_marvel/MainActivity.java', 'app/src/main/res/navigation/main_graph.xml'}
          hero_form_only = bool(paths & {'.github/scripts/check-hero-form.py', 'app/src/main/java/com/example/app_marvel/ui/createhero/CreateHeroFragment.java', 'app/src/main/java/com/example/app_marvel/ui/createhero/CreateHeroViewModel.java'}) and paths <= hero_form_allowed
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('hero_form_only=' + str(hero_form_only).lower() + '\n')
              output.write('series_detail_followup_only=' + str(series_detail_followup_only).lower() + '\n')
              output.write('series_detail_only=' + str(series_detail_only).lower() + '\n')
              output.write('series_only=' + str(series_only).lower() + '\n')
              output.write('series_test_only=' + str(series_test_only).lower() + '\n')
              output.write('movie_detail_test_only=' + str(movie_detail_test_only).lower() + '\n')
              output.write('movie_detail_only=' + str(movie_detail_only).lower() + '\n')
              output.write('movie_only=' + str(movie_only).lower() + '\n')
              output.write('issue_only=' + str(focused).lower() + '\n')
              output.write('arc_detail_only=' + str(arc_detail_only).lower() + '\n')
              output.write('arc_only=' + str(arc_only).lower() + '\n')
          print('Fluxos de séries e card compartilhado.' if series_only else 'Fluxos de filmes e perfis vinculados.' if movie_detail_only else 'Roteiro de filmes isolado.' if movie_only else 'Roteiro de arcos isolado.' if arc_only else 'Roteiro de detalhes isolado.' if focused else 'Verificação integrada da aplicação.')
          PYTHON
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
          log-accepted-android-sdk-licenses: false
      - name: Aplicar configuração Firebase quando fornecida
        env:
          FIREBASE_CONFIG: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$FIREBASE_CONFIG" ]; then
            printf '%s' "$FIREBASE_CONFIG" > app/google-services.json
          fi
      - name: Instalar a plataforma existente do projeto
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - name: Compilar e verificar lint (sem testes unitários)
        run: bash gradlew :app:assembleDebug :app:lintDebug --no-daemon --console=plain
      - name: Disponibilizar APK somente em execução manual
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: app-marvel-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Iniciar emulador para verificar a aplicação
        id: emulator
        env:
          COMICVINE_API_KEY: ${{ secrets.COMICVINE_API_KEY }}
        timeout-minutes: 10
        run: |
          sudo chmod a+rw /dev/kvm
          sdkmanager "emulator" "system-images;android-35;google_apis;x86_64"
          printf 'no\n' | avdmanager create avd -n MarvPreview -k "system-images;android-35;google_apis;x86_64" --force
          "$ANDROID_HOME/emulator/emulator" -avd MarvPreview -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader > /tmp/marv-emulator.log 2>&1 &
          timeout 180 adb wait-for-device || { tail -100 /tmp/marv-emulator.log; exit 1; }
          for attempt in $(seq 1 90); do
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; then break; fi
            sleep 2
          done
          adb shell input keyevent 82
          python3 - <<'PY'
          import os
          from pathlib import Path
          Path('.env').write_text('COMICVINE_API_KEY=' + os.environ['COMICVINE_API_KEY'] + '\n', encoding='utf-8')
          PY
          trap 'rm -f .env' EXIT
          env -u COMICVINE_API_KEY bash gradlew :app:runLocalDebug --no-daemon --console=plain
          python3 - <<'PY'
          import os, zipfile
          key = os.environ['COMICVINE_API_KEY'].encode()
          with zipfile.ZipFile('app/build/outputs/apk/debug/app-debug.apk') as apk:
              assert all(key not in apk.read(name) for name in apk.namelist()), 'Credencial encontrada no APK'
          print('Credencial local fora do APK conferida.')
          PY
      - name: Verificar ML Kit e cache persistente no emulador
        if: steps.emulator.outcome == 'success'
        timeout-minutes: 6
        run: python3 .github/scripts/check-data.py
      - name: Verificar catálogo ComicVine real e cache no emulador
        if: ${{ !cancelled() && steps.emulator.outcome == 'success' && steps.scope.outputs.hero_form_only != 'true' && steps.scope.outputs.series_detail_only != 'true' && steps.scope.outputs.series_only != 'true' && steps.scope.outputs.movie_detail_only != 'true' && steps.scope.outputs.movie_only != 'true' && steps.scope.outputs.issue_only != 'true' && steps.scope.outputs.arc_only != 'true' && steps.scope.outputs.arc_detail_only != 'true' }}
        timeout-minutes: 15
        run: python3 .github/scripts/check-catalog.py --compact || { adb logcat -d -s AndroidRuntime:E ComicVine:W; exit 1; }
      - name: Verificar quadrinhos reais, cache e navegação
        if: ${{ !cancelled() && steps.emulator.outcome == 'success' && steps.scope.outputs.hero_form_only != 'true' && steps.scope.outputs.series_detail_only != 'true' && steps.scope.outputs.series_only != 'true' && steps.scope.outputs.movie_detail_only != 'true' && steps.scope.outputs.movie_only != 'true' && steps.scope.outputs.issue_only != 'true' && steps.scope.outputs.arc_only != 'true' && steps.scope.outputs.arc_detail_only != 'true' }}
        timeout-minutes: 7
        env:
          COMICVINE_API_KEY: ${{ secrets.COMICVINE_API_KEY }}
        run: |
          python3 tools/comicvine.py device
          python3 .github/scripts/check-comics.py || { adb logcat -d -s AndroidRuntime:E ComicVine:W; exit 1; }
      - name: Verificar detalhes nativos de quadrinhos
        if: ${{ !cancelled() && steps.emulator.outcome == 'success' && steps.scope.outputs.hero_form_only != 'true' && steps.scope.outputs.series_detail_only != 'true' && steps.scope.outputs.series_only != 'true' && steps.scope.outputs.movie_detail_only != 'true' && steps.scope.outputs.movie_only != 'true' && steps.scope.outputs.arc_only != 'true' && steps.scope.outputs.arc_detail_only != 'true' }}
        timeout-minutes: 9
        env:
          COMICVINE_API_KEY: ${{ secrets.COMICVINE_API_KEY }}
        run: |
          python3 tools/comicvine.py device
          python3 .github/scripts/check-issue.py || { adb logcat -d -s AndroidRuntime:E ComicVine:W; exit 1; }
      - name: Verificar catálogo nativo de arcos
        if: ${{ !cancelled() && steps.emulator.outcome == 'success' && steps.scope.outputs.hero_form_only != 'true' && steps.scope.outputs.series_detail_only != 'true' && steps.scope.outputs.series_only != 'true' && steps.scope.outputs.movie_detail_only != 'true' && steps.scope.outputs.movie_only != 'true' && steps.scope.outputs.arc_detail_only != 'true' && steps.scope.outputs.issue_only != 'true' }}
        timeout-minutes: 9
        env:
          COMICVINE_API_KEY: ${{ secrets.COMICVINE_API_KEY }}
        run: |
          python3 tools/comicvine.py device
          python3 .github/scripts/check-arcs.py || { adb logcat -d -s AndroidRuntime:E ComicVine:W; exit 1; }
      - name: Verificar detalhes nativos de arcos
        if: ${{ !cancelled() && steps.emulator.outcome == 'success' && steps.scope.outputs.hero_form_only != 'true' && steps.scope.outputs.series_detail_only != 'true' && steps.scope.outputs.series_only != 'true' && steps.scope.outputs.movie_detail_only != 'true' && steps.scope.outputs.movie_only != 'true' && steps.scope.outputs.issue_only != 'true' && steps.scope.outputs.arc_only != 'true' }}
        timeout-minutes: 10
        env:
          COMICVINE_API_KEY: ${{ secrets.COMICVINE_API_KEY }}
        run: |
          python3 tools/comicvine.py device
          python3 .github/scripts/check-arc-detail.py || { adb logcat -d -s AndroidRuntime:E ComicVine:W; exit 1; }
      - name: Verificar catálogo nativo de filmes
        if: ${{ !cancelled() && steps.emulator.outcome == 'success' && steps.scope.outputs.hero_form_only != 'true' && steps.scope.outputs.series_detail_only != 'true' && steps.scope.outputs.series_test_only != 'true' && steps.scope.outputs.movie_detail_test_only != 'true' && steps.scope.outputs.issue_only != 'true' && steps.scope.outputs.arc_only != 'true' && steps.scope.outputs.arc_detail_only != 'true' }}
        timeout-minutes: 10
        env:
          COMICVINE_API_KEY: ${{ secrets.COMICVINE_API_KEY }}
        run: |
          python3 tools/comicvine.py device
          python3 .github/scripts/check-movies.py || { adb logcat -d -s AndroidRuntime:E ComicVine:W; exit 1; }
      - name: Verificar detalhes nativos de filmes
        if: ${{ !cancelled() && steps.emulator.outcome == 'success' && steps.scope.outputs.hero_form_only != 'true' && steps.scope.outputs.series_detail_only != 'true' && steps.scope.outputs.series_only != 'true' && steps.scope.outputs.issue_only != 'true' && steps.scope.outputs.arc_only != 'true' && steps.scope.outputs.arc_detail_only != 'true' && steps.scope.outputs.movie_only != 'true' }}
        timeout-minutes: 15
        env:
          COMICVINE_API_KEY: ${{ secrets.COMICVINE_API_KEY }}
        run: |
          python3 tools/comicvine.py device
          python3 .github/scripts/check-movie-detail.py || { adb logcat -d -s AndroidRuntime:E ComicVine:W; exit 1; }
      - name: Verificar catálogo nativo de séries
        if: ${{ !cancelled() && steps.emulator.outcome == 'success' && steps.scope.outputs.hero_form_only != 'true' && steps.scope.outputs.series_detail_followup_only != 'true' && steps.scope.outputs.issue_only != 'true' && steps.scope.outputs.arc_only != 'true' && steps.scope.outputs.arc_detail_only != 'true' && steps.scope.outputs.movie_only != 'true' && steps.scope.outputs.movie_detail_only != 'true' }}
        timeout-minutes: 10
        env:
          COMICVINE_API_KEY: ${{ secrets.COMICVINE_API_KEY }}
        run: |
          python3 tools/comicvine.py device
          python3 .github/scripts/check-series.py || { adb logcat -d -s AndroidRuntime:E ComicVine:W; exit 1; }
      - name: Verificar detalhes nativos de séries e episódios
        if: ${{ !cancelled() && steps.emulator.outcome == 'success' && steps.scope.outputs.hero_form_only != 'true' && steps.scope.outputs.series_detail_only == 'true' }}
        timeout-minutes: 15
        env:
          COMICVINE_API_KEY: ${{ secrets.COMICVINE_API_KEY }}
        run: |
          python3 tools/comicvine.py device
          if [ "${{ steps.scope.outputs.series_detail_followup_only }}" = "true" ]; then
            python3 .github/scripts/check-series-detail.py --layout-only || { adb logcat -d -s AndroidRuntime:E ComicVine:W; exit 1; }
          else
            python3 .github/scripts/check-series-detail.py || { adb logcat -d -s AndroidRuntime:E ComicVine:W; exit 1; }
          fi
      - name: Verificar criação guiada, dados reais e rascunho no emulador
        if: ${{ !cancelled() && steps.emulator.outcome == 'success' && steps.scope.outputs.hero_form_only == 'true' }}
        timeout-minutes: 10
        run: python3 .github/scripts/check-hero-form.py || { adb logcat -d -s AndroidRuntime:E ComicVine:W; exit 1; }
      - name: Disponibilizar evidências do catálogo
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-catalog-check
          path: app/build/catalog-check/*.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Disponibilizar resultado da tradução real
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-data-check
          path: app/build/data-check/*.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Disponibilizar capturas do emulador
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-preview
          path: app/build/previews/*
          if-no-files-found: ignore
          retention-days: 7
      - name: Disponibilizar relatórios de lint
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-lint
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 7
