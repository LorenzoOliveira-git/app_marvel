name: Exportar APK Preview existente

on:
  push:
    branches: ["codex/apk-preview-export"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Baixar APK já compilado
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 37203512585 --repo LorenzoOliveira-git/app_marvel --name app-marvel-preview --dir preview
      - name: Preparar transferência completa e verificável
        run: |
          cd preview
          sha256sum app-marvel-preview.apk > app-marvel-preview.sha256
          stat -c '%s' app-marvel-preview.apk > app-marvel-preview.size
          gzip -c -9 app-marvel-preview.apk > app-marvel-preview.apk.gz
          split -b 20M app-marvel-preview.apk.gz app-marvel-preview.apk.gz.part-
          test ! -f app-marvel-preview.apk.gz.part-ad
      - uses: actions/upload-artifact@v7
        with:
          name: preview-export-1
          path: |
            preview/app-marvel-preview.apk.gz.part-aa
            preview/app-marvel-preview.sha256
            preview/app-marvel-preview.size
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: preview-export-2
          path: preview/app-marvel-preview.apk.gz.part-ab
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: preview-export-3
          path: preview/app-marvel-preview.apk.gz.part-ac
          if-no-files-found: ignore
          retention-days: 7
