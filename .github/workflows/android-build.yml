name: Android build e lint

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
          log-accepted-android-sdk-licenses: false
      - name: Aplicar configuração Firebase quando fornecida
        env:
          FIREBASE_CONFIG: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$FIREBASE_CONFIG" ]; then
            printf '%s' "$FIREBASE_CONFIG" > app/google-services.json
          fi
      - name: Instalar a plataforma existente do projeto
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - name: Compilar e verificar lint (sem testes unitários)
        run: bash gradlew :app:assembleDebug :app:lintDebug :app:assemblePreview :app:lintPreview :app:compileReleaseJavaWithJavac --no-daemon --console=plain
      - name: Disponibilizar APK de depuração
        uses: actions/upload-artifact@v7
        with:
          name: app-marvel-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Preparar APK de demonstração para download
        run: |
          mkdir -p app/build/preview-download
          cp app/build/outputs/apk/preview/app-preview.apk app/build/preview-download/app-marvel-preview.apk
          cd app/build/preview-download
          sha256sum app-marvel-preview.apk > app-marvel-preview.sha256
          split -b 20M app-marvel-preview.apk app-marvel-preview.apk.part-
      - name: Disponibilizar APK de demonstração
        uses: actions/upload-artifact@v7
        with:
          name: app-marvel-preview
          path: app/build/preview-download/app-marvel-preview.apk
          if-no-files-found: error
          retention-days: 7
      - name: Disponibilizar primeira parte do APK
        uses: actions/upload-artifact@v7
        with:
          name: app-marvel-preview-part-1
          path: |
            app/build/preview-download/app-marvel-preview.apk.part-aa
            app/build/preview-download/app-marvel-preview.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Disponibilizar segunda parte do APK
        uses: actions/upload-artifact@v7
        with:
          name: app-marvel-preview-part-2
          path: app/build/preview-download/app-marvel-preview.apk.part-ab
          if-no-files-found: ignore
          retention-days: 7
      - name: Disponibilizar terceira parte do APK
        uses: actions/upload-artifact@v7
        with:
          name: app-marvel-preview-part-3
          path: app/build/preview-download/app-marvel-preview.apk.part-ac
          if-no-files-found: ignore
          retention-days: 7
      - name: Capturar login, cadastro e painel no emulador
        continue-on-error: true
        timeout-minutes: 10
        run: |
          sudo chmod a+rw /dev/kvm
          sdkmanager "emulator" "system-images;android-35;google_apis;x86_64"
          printf 'no\n' | avdmanager create avd -n MarvPreview -k "system-images;android-35;google_apis;x86_64" --force
          "$ANDROID_HOME/emulator/emulator" -avd MarvPreview -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader > /tmp/marv-emulator.log 2>&1 &
          timeout 180 adb wait-for-device || { tail -100 /tmp/marv-emulator.log; exit 1; }
          for attempt in $(seq 1 90); do
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; then break; fi
            sleep 2
          done
          adb shell input keyevent 82
          adb install -r app/build/outputs/apk/debug/app-debug.apk
          python3 .github/scripts/capture-preview.py || { adb logcat -d -s AndroidRuntime:E; exit 1; }
      - name: Verificar ML Kit e cache persistente no emulador
        timeout-minutes: 6
        run: python3 .github/scripts/check-data.py
      - name: Disponibilizar resultado da tradução real
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-data-check
          path: app/build/data-check/*.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Verificar demonstração offline no emulador
        timeout-minutes: 6
        run: |
          adb install -r app/build/outputs/apk/preview/app-preview.apk
          python3 .github/scripts/check-preview.py
      - name: Disponibilizar capturas e resultado da demonstração
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-preview-offline
          path: app/build/preview-check/*
          if-no-files-found: ignore
          retention-days: 7
      - name: Disponibilizar capturas do emulador
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-preview
          path: app/build/previews/*
          if-no-files-found: ignore
          retention-days: 7
      - name: Disponibilizar relatórios de lint
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-lint
          path: app/build/reports/lint-results-*.*
          if-no-files-found: ignore
          retention-days: 7
