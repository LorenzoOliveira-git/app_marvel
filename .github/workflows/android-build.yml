name: Verificar contrato ComicVine para bloco 3

on:
  push:
    branches: ["codex/comicvine-contract-check"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Verificar configuração e consultar respostas sanitizadas
        env:
          COMICVINE_API_KEY: ${{ secrets.COMICVINE_API_KEY }}
        run: |
          if [ -z "$COMICVINE_API_KEY" ]; then
            printf '%s\n' '{"key_configured":false,"inspection_executed":false}' > comicvine-configuration-status.json
          else
            printf '%s\n' '{"key_configured":true,"inspection_executed":true}' > comicvine-configuration-status.json
            python3 tools/comicvine.py inspect --output comicvine-inspection.json
          fi
      - name: Disponibilizar status e respostas sem chave
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: comicvine-contract-check
          path: |
            comicvine-configuration-status.json
            comicvine-inspection.json
          if-no-files-found: error
          retention-days: 7
