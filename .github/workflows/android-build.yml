name: Android build e lint

on:
  push:
    branches: [main, "codex/**"]
    paths-ignore: ["tools/comicvine_history_contract.py", ".github/workflows/comicvine-history-contract.yml", "tools/comicvine_comics_contract.py", ".github/workflows/comicvine-comics-contract.yml"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
          log-accepted-android-sdk-licenses: false
      - name: Aplicar configuração Firebase quando fornecida
        env:
          FIREBASE_CONFIG: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$FIREBASE_CONFIG" ]; then
            printf '%s' "$FIREBASE_CONFIG" > app/google-services.json
          fi
      - name: Instalar a plataforma existente do projeto
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - name: Compilar e verificar lint (sem testes unitários)
        run: bash gradlew :app:assembleDebug :app:lintDebug --no-daemon --console=plain
      - name: Disponibilizar APK somente em execução manual
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: app-marvel-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Iniciar emulador para verificar a aplicação
        id: emulator
        env:
          COMICVINE_API_KEY: ${{ secrets.COMICVINE_API_KEY }}
        timeout-minutes: 10
        run: |
          sudo chmod a+rw /dev/kvm
          sdkmanager "emulator" "system-images;android-35;google_apis;x86_64"
          printf 'no\n' | avdmanager create avd -n MarvPreview -k "system-images;android-35;google_apis;x86_64" --force
          "$ANDROID_HOME/emulator/emulator" -avd MarvPreview -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader > /tmp/marv-emulator.log 2>&1 &
          timeout 180 adb wait-for-device || { tail -100 /tmp/marv-emulator.log; exit 1; }
          for attempt in $(seq 1 90); do
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; then break; fi
            sleep 2
          done
          adb shell input keyevent 82
          python3 - <<'PY'
          import os
          from pathlib import Path
          Path('.env').write_text('COMICVINE_API_KEY=' + os.environ['COMICVINE_API_KEY'] + '\n', encoding='utf-8')
          PY
          trap 'rm -f .env' EXIT
          env -u COMICVINE_API_KEY bash gradlew :app:runLocalDebug --no-daemon --console=plain
          python3 - <<'PY'
          import os, zipfile
          key = os.environ['COMICVINE_API_KEY'].encode()
          with zipfile.ZipFile('app/build/outputs/apk/debug/app-debug.apk') as apk:
              assert all(key not in apk.read(name) for name in apk.namelist()), 'Credencial encontrada no APK'
          print('Credencial local fora do APK conferida.')
          PY
      - name: Verificar ML Kit e cache persistente no emulador
        timeout-minutes: 6
        run: python3 .github/scripts/check-data.py
      - name: Verificar catálogo ComicVine real e cache no emulador
        if: ${{ !cancelled() && steps.emulator.outcome == 'success' }}
        timeout-minutes: 15
        run: python3 .github/scripts/check-catalog.py --compact || { adb logcat -d -s AndroidRuntime:E ComicVine:W; exit 1; }
      - name: Verificar quadrinhos reais, cache e navegação
        if: ${{ !cancelled() && steps.emulator.outcome == 'success' }}
        timeout-minutes: 7
        env:
          COMICVINE_API_KEY: ${{ secrets.COMICVINE_API_KEY }}
        run: |
          python3 tools/comicvine.py device
          python3 .github/scripts/check-comics.py || { adb logcat -d -s AndroidRuntime:E ComicVine:W; exit 1; }
      - name: Verificar detalhes nativos de quadrinhos
        if: ${{ !cancelled() && steps.emulator.outcome == 'success' }}
        timeout-minutes: 9
        env:
          COMICVINE_API_KEY: ${{ secrets.COMICVINE_API_KEY }}
        run: |
          python3 tools/comicvine.py device
          python3 .github/scripts/check-issue.py || { adb logcat -d -s AndroidRuntime:E ComicVine:W; exit 1; }
      - name: Disponibilizar evidências do catálogo
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-catalog-check
          path: app/build/catalog-check/*.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Disponibilizar resultado da tradução real
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-data-check
          path: app/build/data-check/*.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Disponibilizar capturas do emulador
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-preview
          path: app/build/previews/*
          if-no-files-found: ignore
          retention-days: 7
      - name: Disponibilizar relatórios de lint
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-lint
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 7
