name: Android build e lint

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
          log-accepted-android-sdk-licenses: false
      - name: Instalar a plataforma existente do projeto (incluindo canais de preview)
        run: |
          sdkmanager --list --channel=3
          sdkmanager --channel=3 "platforms;android-37" "build-tools;36.0.0"
      - name: Compilar e verificar lint (sem testes unitários)
        run: bash gradlew :app:assembleDebug :app:lintDebug --no-daemon --console=plain
      - name: Disponibilizar APK de depuração
        uses: actions/upload-artifact@v7
        with:
          name: app-marvel-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Disponibilizar relatórios de lint
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-lint
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 7
